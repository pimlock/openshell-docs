# Build the whole site from sources.yml and publish it to GitHub Pages.
#
# Runs on changes to this repo, hourly (to pick up new commits on each
# source's dev branch), and on demand. In production a source repo would
# trigger it with repository_dispatch when it pushes main or a release tag.
name: Site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [docs-source-updated]

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Checkouts are keyed by commit, so old entries stay valid forever.
      - uses: actions/cache@v4
        with:
          path: .cache/sources
          key: sources-${{ github.run_id }}
          restore-keys: sources-
      - run: npm ci
      - name: Assemble (fetches each source at its ref)
        run: node assembler/assemble.mjs --base /${{ github.event.repository.name }}/
      - name: Build site
        run: npm run site
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io
      - name: Record the commits this build used
        run: |
          echo '### Sources' >> "$GITHUB_STEP_SUMMARY"
          echo '| Version | Ref | Commit | Format |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|---|---|' >> "$GITHUB_STEP_SUMMARY"
          node -e 'for (const [k, v] of Object.entries(require("./build/assembled/sources.lock.json"))) console.log(`| ${k} | ${v.repo}@${v.ref} | ${v.sha.slice(0, 12)} | ${v.format} |`)' >> "$GITHUB_STEP_SUMMARY"
          cp build/assembled/sources.lock.json site/dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
