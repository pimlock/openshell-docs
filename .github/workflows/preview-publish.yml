# Publish a docs preview built by preview-build.yml. Step 2 of 3.
#
# Runs on workflow_run, so it runs the caller workflow from the default
# branch with a token that can write. It never runs code from the pull
# request; the artifacts it downloads are untrusted data.
#
#   verify   Reads the pull request number from docs-preview-meta, and only
#            trusts it when GitHub says that pull request's head is the commit
#            the build ran on. Anything else is either an outdated run
#            (skipped quietly) or a spoofed number (fails).
#   publish  Runs in a GitHub environment: `environment` for branches of the
#            calling repo, `fork-environment` for forks. Give the fork
#            environment required reviewers to approve each fork preview
#            before it is published. Checks the site is plain files, then
#            copies it to gh-pages/pr-<n>/.
#   report   Sets the docs/preview commit status and the pull request
#            comment.
#
# The calling repo serves GitHub Pages from its gh-pages branch.
#
# Caller (source repo, .github/workflows/docs-preview-publish.yml):
#
#   name: Docs preview publish
#   on:
#     workflow_run:
#       workflows: [Docs preview]
#       types: [completed]
#   permissions: {}
#   jobs:
#     publish:
#       uses: pimlock/openshell-docs/.github/workflows/preview-publish.yml@<sha>
#       with:
#         site-ref: <sha>       # the same commit as `uses:`
#       permissions:
#         actions: read         # download the build's artifacts
#         contents: write       # push gh-pages
#         pull-requests: write  # comment
#         statuses: write       # docs/preview commit status
name: Docs preview publish

on:
  workflow_call:
    inputs:
      site-ref:
        description: Commit of pimlock/openshell-docs whose scripts publish the preview. Pin it to the same commit as `uses:`.
        required: false
        type: string
        default: main
      environment:
        description: Environment for pull requests from branches of the calling repo
        required: false
        type: string
        default: docs-preview
      fork-environment:
        description: Environment for pull requests from forks (give it required reviewers)
        required: false
        type: string
        default: docs-preview-fork

permissions: {}

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
      statuses: write
    outputs:
      pr: ${{ steps.verify.outputs.pr }}
      fork: ${{ steps.verify.outputs.fork }}
      url: ${{ steps.verify.outputs.url }}
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      FORK_ENVIRONMENT: ${{ inputs.fork-environment }}
    steps:
      - name: Download the build metadata
        id: meta
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-preview-meta
          path: ${{ runner.temp }}/meta
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Check out the preview scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pimlock/openshell-docs
          ref: ${{ inputs.site-ref }}
          path: docs-site
          sparse-checkout: scripts/preview
          persist-credentials: false
      - name: Verify the pull request
        id: verify
        if: steps.meta.outcome == 'success'
        run: docs-site/scripts/preview/verify.sh "$RUNNER_TEMP/meta/meta.json"
      - name: Report progress
        if: steps.verify.outputs.pr != ''
        env:
          PR: ${{ steps.verify.outputs.pr }}
          FORK: ${{ steps.verify.outputs.fork }}
        run: |
          if [ "$CONCLUSION" != success ]; then exit 0; fi
          if [ "$FORK" = true ]; then
            desc="Built; waiting for approval to publish"
            msg="Built ${RUN_SHA::7}. This pull request comes from a fork, so a maintainer must approve publishing it in the \`$FORK_ENVIRONMENT\` environment: [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          else
            desc="Built; publishing"
            msg="Built ${RUN_SHA::7}, publishing…"
          fi
          docs-site/scripts/preview/status.sh pending "$desc" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          printf '**Docs preview**: %s\n' "$msg" > "$RUNNER_TEMP/comment.md"
          docs-site/scripts/preview/comment.sh "$RUNNER_TEMP/comment.md"

  publish:
    needs: verify
    if: needs.verify.outputs.pr != '' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.verify.outputs.fork == 'true' && inputs.fork-environment || inputs.environment }}
      url: ${{ needs.verify.outputs.url }}
    permissions:
      actions: read
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.verify.outputs.pr }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Download the site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-preview-site
          path: ${{ runner.temp }}/site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Check out the preview scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pimlock/openshell-docs
          ref: ${{ inputs.site-ref }}
          path: docs-site
          sparse-checkout: scripts/preview
          persist-credentials: false
      - name: Check the site is plain files
        run: docs-site/scripts/preview/check-site.sh "$RUNNER_TEMP/site"
      # An approval can come long after the build: don't publish a commit the
      # pull request has moved on from.
      - name: Check the pull request still points at this commit
        id: current
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.head.sha + " " + .state')
          if [ "$head" != "$RUN_SHA open" ]; then
            echo "::notice::PR #$PR moved on ($head); not publishing ${RUN_SHA::7}."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to gh-pages/pr-${{ env.PR }}
        if: steps.current.outputs.stale != 'true'
        run: docs-site/scripts/preview/pages.sh publish "pr-$PR" "$RUNNER_TEMP/site"
    outputs:
      stale: ${{ steps.current.outputs.stale }}

  report:
    needs: [verify, publish]
    if: always() && needs.verify.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ needs.verify.outputs.pr }}
      URL: ${{ needs.verify.outputs.url }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      BUILD_URL: ${{ github.event.workflow_run.html_url }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      PUBLISH: ${{ needs.publish.result }}
      STALE: ${{ needs.publish.outputs.stale }}
    steps:
      - name: Check out the preview scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pimlock/openshell-docs
          ref: ${{ inputs.site-ref }}
          path: docs-site
          sparse-checkout: scripts/preview
          persist-credentials: false
      - name: Set the status and comment
        run: |
          RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$STALE" = true ]; then exit 0; fi
          if [ "$CONCLUSION" != success ]; then
            docs-site/scripts/preview/status.sh failure "Docs build failed" "$BUILD_URL"
            msg="the build of ${RUN_SHA::7} failed. See the [build log]($BUILD_URL)."
          elif [ "$PUBLISH" = success ]; then
            docs-site/scripts/preview/status.sh success "Preview ready" "$URL"
            msg="$URL

          Built from ${RUN_SHA::7}. GitHub Pages can take a minute to update. Only this repo's docs are built; links to other docs open the live site."
          else
            docs-site/scripts/preview/status.sh error "Not published ($PUBLISH)" "$RUN"
            msg="${RUN_SHA::7} was built but not published ($PUBLISH). See the [publish run]($RUN)."
          fi
          printf '**Docs preview**: %s\n' "$msg" > "$RUNNER_TEMP/comment.md"
          docs-site/scripts/preview/comment.sh "$RUNNER_TEMP/comment.md"
