# Reusable docs preview for a source repo's pull requests.
#
# Builds ONLY the calling repo's docs, with this repo's theme and assembler.
# Everything about the other repos comes from the live site's links.json:
# links into them are checked and point at the live site, and pages that
# they link to must survive the change (or be listed under `redirects:`).
#
# Each pull request gets its own preview in the calling repo's gh-pages
# branch (https://<owner>.github.io/<repo>/pr-<n>/), so previews don't
# replace each other, and one comment that is updated on every run. Closing
# the pull request removes its preview.
#
# Experimental: with the `docs-diff` label on the pull request, a second build
# marks what changed on each page (against the base branch) and is published
# at pr-<n>/diff/. It never fails the preview.
#
# The calling repo serves GitHub Pages from the gh-pages branch.
# Caller (in the source repo, .github/workflows/docs-preview.yml):
#
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, closed, labeled, unlabeled]
#       paths: [docs/**]
#   jobs:
#     docs:
#       uses: pimlock/openshell-docs/.github/workflows/preview.yml@main
#       with:
#         docset: driver-docker
#         layout: full            # optional; default fragment
#       permissions:
#         contents: write
#         pull-requests: write
name: Docs preview

on:
  workflow_call:
    inputs:
      docset:
        description: Docset id of the calling repo (see sources.yml)
        required: true
        type: string
      site:
        description: Live site that publishes links.json
        required: false
        type: string
        default: https://pimlock.github.io/openshell-docs
      layout:
        description: "fragment: header naming the docset, its sidebar and content; full: the site's tabs and version picker (linking to the live site)"
        required: false
        type: string
        default: fragment

jobs:
  preview:
    # (other labels don't need a rebuild)
    if: >-
      github.event.action != 'closed' &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'docs-diff')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: docs-preview-${{ github.repository }}-${{ github.event.pull_request.number || github.ref_name }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DOCSET: ${{ inputs.docset }}
      SITE: ${{ inputs.site }}
      LAYOUT: ${{ inputs.layout }}
      HEAD_REF: ${{ github.head_ref || github.ref_name }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      DIFF: ${{ contains(github.event.pull_request.labels.*.name, 'docs-diff') }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Choose the preview folder
        env:
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$PR" ]; then SLOT="pr-$PR"; else SLOT="ref-${REF_NAME//[^A-Za-z0-9._-]/-}"; fi
          {
            echo "SLOT=$SLOT"
            echo "BASE_PATH=/$REPO_NAME/$SLOT/"
            echo "PREVIEW_URL=https://${OWNER,,}.github.io/$REPO_NAME/$SLOT/"
          } >> "$GITHUB_ENV"
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          path: source
      - name: Check out the docs site (theme + assembler)
        uses: actions/checkout@v4
        with:
          repository: pimlock/openshell-docs
          path: docs-site
      - name: Comment that the preview is building
        if: env.PR != ''
        run: |
          printf '**Docs preview** for `%s`: building %s…\n' "$DOCSET" "${SHA::7}" > "$RUNNER_TEMP/comment.md"
          docs-site/scripts/preview/comment.sh "$RUNNER_TEMP/comment.md"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      - name: Assemble this docset against the published link index
        working-directory: docs-site
        run: |
          set -o pipefail
          REF="${SHA::7}"
          if [ -n "$PR" ]; then REF="PR #$PR, $REF"; fi
          node assembler/assemble.mjs --preview "$DOCSET" --path ../source \
            --index "$SITE/links.json" --site "$SITE" --ref "$REF" \
            --base "$BASE_PATH" --layout "$LAYOUT" \
            --branch "$HEAD_REF" --edit-repo "$HEAD_REPO" --out build/preview 2>&1 | tee "$RUNNER_TEMP/assemble.log"
      - name: Build
        working-directory: docs-site
        run: npm run site
        env:
          ASSEMBLED: build/preview
          SITE_URL: https://${{ github.repository_owner }}.github.io
      - name: Keep the preview
        run: cp -R docs-site/site/dist "$RUNNER_TEMP/site"

      # --- experimental diff view (docs-diff label) ---
      - name: Check out the base commit
        if: env.DIFF == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - name: Build the diff view
        id: diff
        if: env.DIFF == 'true'
        continue-on-error: true
        working-directory: docs-site
        run: |
          start=$(date +%s)
          node assembler/assemble.mjs --preview "$DOCSET" --path ../source \
            --index "$SITE/links.json" --site "$SITE" --ref "PR #$PR, ${SHA::7}" \
            --base "${BASE_PATH}diff/" --layout "$LAYOUT" --branch "$HEAD_REF" --edit-repo "$HEAD_REPO" \
            --diff-base ../base --diff-label "$BASE_REF" --out build/preview-diff
          ASSEMBLED=build/preview-diff BASE_PATH="${BASE_PATH}diff/" npm run site
          cp -R site/dist "$RUNNER_TEMP/site/diff"
          cp build/preview-diff/diff.json "$RUNNER_TEMP/diff.json"
          echo "Diff view built in $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io

      - name: Publish to gh-pages/${{ env.SLOT }}
        run: docs-site/scripts/preview/pages.sh publish "$SLOT" "$RUNNER_TEMP/site"
      - name: Comment with the preview link
        if: env.PR != ''
        run: |
          {
            printf '**Docs preview** for `%s` at %s: %s\n\n' "$DOCSET" "${SHA::7}" "$PREVIEW_URL"
            if [ "$DIFF" = true ] && [ -f "$RUNNER_TEMP/diff.json" ]; then
              node docs-site/scripts/preview/diff-comment.mjs "$RUNNER_TEMP/diff.json" "$PREVIEW_URL"
            elif [ "$DIFF" = true ]; then
              echo "**Diff view** failed to build (experimental; see the workflow run)."
              echo
            else
              echo "Add the \`docs-diff\` label to also build a view that marks what changed on each page."
              echo
            fi
            echo "Only this repo's docs are built; links to other docs open the [live site]($SITE/). GitHub Pages can take a minute to update."
          } > "$RUNNER_TEMP/comment.md"
          docs-site/scripts/preview/comment.sh "$RUNNER_TEMP/comment.md"
      - name: Comment that the preview failed
        if: failure() && env.PR != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            printf '**Docs preview** for `%s` at %s failed. [Workflow run](%s)\n' "$DOCSET" "${SHA::7}" "$RUN_URL"
            if grep -q 'error(s):' "$RUNNER_TEMP/assemble.log" 2>/dev/null; then
              printf '\n```\n'
              sed -n '/error(s):/,$p' "$RUNNER_TEMP/assemble.log" | head -40
              printf '```\n'
            fi
          } > "$RUNNER_TEMP/comment.md"
          docs-site/scripts/preview/comment.sh "$RUNNER_TEMP/comment.md"
      - name: Summary
        if: success()
        run: echo "Preview of $DOCSET at $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"

  remove:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: docs-preview-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pimlock/openshell-docs
          path: docs-site
          sparse-checkout: scripts/preview
      - name: Remove gh-pages/pr-${{ env.PR }}
        run: docs-site/scripts/preview/pages.sh remove "pr-$PR"
      - name: Update the comment
        run: |
          echo "**Docs preview** removed: the pull request is closed." > "$RUNNER_TEMP/comment.md"
          docs-site/scripts/preview/comment.sh "$RUNNER_TEMP/comment.md"
